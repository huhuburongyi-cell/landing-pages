<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>景秀游戏｜买量落地页汇总</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--card:#14141f;--card-hover:#1a1a2e;
  --text:#e8e8f0;--text-dim:#8888a0;--accent:#6c5ce7;
  --accent-light:#a29bfe;--border:#2a2a3e;--tag-bg:#1e1e30;
  --shadow:0 4px 24px rgba(0,0,0,.4);
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;line-height:1.6;min-height:100vh}

/* Header */
.header{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 24px}
.header-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.search-box{flex:1;min-width:200px;max-width:400px;position:relative}
.search-box input{width:100%;padding:10px 16px 10px 40px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;outline:none;transition:border .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-dim)}
.stats{font-size:13px;color:var(--text-dim);white-space:nowrap}

/* Filters */
.filters{max-width:1600px;margin:0 auto;padding:16px 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.filter-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.filter-label{font-size:12px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.filter-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:13px;cursor:pointer;transition:all .2s;white-space:nowrap}
.filter-btn:hover{border-color:var(--accent);color:var(--text)}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.divider{width:1px;height:24px;background:var(--border);margin:0 8px}

/* Grid */
.grid-container{max-width:1600px;margin:0 auto;padding:16px 24px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}

/* Card */
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--border);transition:all .3s;cursor:pointer}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent)}
.card-images{position:relative;overflow:hidden;background:#0d0d15}
.card-images .img-scroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none}
.card-images .img-scroll::-webkit-scrollbar{display:none}
.card-images .img-item{flex:0 0 100%;scroll-snap-align:start;position:relative}
.card-images .img-item img{width:100%;height:auto;min-height:200px;max-height:420px;object-fit:cover;object-position:top;display:block;transition:transform .3s}
.card:hover .img-item img{transform:scale(1.02)}
.img-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2}
.img-dots .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);transition:all .2s}
.img-dots .dot.active{background:#fff;transform:scale(1.3)}
.img-count{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);padding:2px 8px;border-radius:10px;font-size:11px;color:#fff;z-index:2}

.card-body{padding:14px 16px}
.card-title{font-size:14px;font-weight:600;line-height:1.5;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:2px 10px;border-radius:12px;font-size:11px;background:var(--tag-bg);color:var(--accent-light);border:1px solid rgba(108,92,231,.2)}
.tag.game{background:rgba(108,92,231,.15);border-color:rgba(108,92,231,.3);color:var(--accent-light);font-weight:600}
.tag.stage{background:rgba(0,206,209,.1);border-color:rgba(0,206,209,.2);color:#00ced1}
.tag.cat{background:rgba(255,165,0,.08);border-color:rgba(255,165,0,.15);color:#ffa500}

/* Lightbox */
.lightbox{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1000;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.lightbox.show{display:flex}
.lightbox-close{position:absolute;top:20px;right:24px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
.lightbox-close:hover{background:rgba(255,255,255,.2)}
.lightbox-content{display:flex;align-items:center;justify-content:center;max-height:90vh;max-width:90vw;overflow:auto}
.lightbox-content img{max-height:88vh;max-width:88vw;object-fit:contain;border-radius:8px}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;transition:background .2s}
.lightbox-nav:hover{background:rgba(255,255,255,.25)}
.lightbox-nav.prev{left:20px}
.lightbox-nav.next{right:20px}
.lightbox-info{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);text-align:center;max-width:80vw}
.lightbox-info .lb-title{font-size:15px;color:#fff;margin-bottom:4px}
.lightbox-info .lb-meta{font-size:12px;color:rgba(255,255,255,.5)}

/* Empty state */
.empty{text-align:center;padding:80px 20px;color:var(--text-dim)}
.empty svg{width:64px;height:64px;margin-bottom:16px;opacity:.4}
.empty p{font-size:15px}

/* Responsive */
@media(max-width:768px){
  .header-inner{gap:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .filters{padding:12px 16px}
  .grid-container{padding:12px 16px 40px}
}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}

/* Back to top */
.back-to-top{position:fixed;bottom:32px;right:32px;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:rgba(20,20,31,.9);backdrop-filter:blur(10px);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:99;opacity:0;transform:translateY(12px);pointer-events:none;transition:all .3s}
.back-to-top.show{opacity:1;transform:translateY(0);pointer-events:auto}
.back-to-top:hover{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(108,92,231,.4)}

/* Animation */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fadeUp .4s ease both}
.card:nth-child(2){animation-delay:.03s}
.card:nth-child(3){animation-delay:.06s}
.card:nth-child(4){animation-delay:.09s}
.card:nth-child(5){animation-delay:.12s}
.card:nth-child(6){animation-delay:.15s}
</style>
</head>

let currentLbIndex = 0;
let currentLbRecord = null;
let currentLbImages = [];
let activeFilters = { game: null, stage: null, category: null };
let searchTerm = '';

// Init
function init() {
  buildFilters();
  renderCards();
  document.getElementById('searchInput').addEventListener('input', e => {
    searchTerm = e.target.value.trim().toLowerCase();
    renderCards();
  });
}

function buildFilters() {
  const games = [...new Set(DATA.map(d => d.game))].sort();
  const stages = [...new Set(DATA.map(d => d.stage).filter(Boolean))].sort();
  const cats = [...new Set(DATA.flatMap(d => d.category))].sort();

  const gameEl = document.getElementById('gameFilters');
  gameEl.innerHTML = `<button class="filter-btn active" data-type="game" data-val="">全部</button>` +
    games.map(g => `<button class="filter-btn" data-type="game" data-val="${g}">${g}</button>`).join('');

  const stageEl = document.getElementById('stageFilters');
  stageEl.innerHTML = `<button class="filter-btn active" data-type="stage" data-val="">全部</button>` +
    stages.map(s => `<button class="filter-btn" data-type="stage" data-val="${s}">${s}</button>`).join('');

  const catEl = document.getElementById('catFilters');
  catEl.innerHTML = `<button class="filter-btn active" data-type="category" data-val="">全部</button>` +
    cats.map(c => `<button class="filter-btn" data-type="category" data-val="${c}">${c}</button>`).join('');

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.type;
      const val = btn.dataset.val || null;
      activeFilters[type] = val;
      // Update active state
      btn.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCards();
    });
  });
}

function getFiltered() {
  return DATA.filter(d => {
    if (activeFilters.game && d.game !== activeFilters.game) return false;
    if (activeFilters.stage && d.stage !== activeFilters.stage) return false;
    if (activeFilters.category && !d.category.includes(activeFilters.category)) return false;
    if (searchTerm && !d.title.toLowerCase().includes(searchTerm)) return false;
    return true;
  });
}

function renderCards() {
  const filtered = getFiltered();
  const grid = document.getElementById('cardGrid');
  const empty = document.getElementById('emptyState');
  const stats = document.getElementById('stats');

  stats.textContent = `显示 ${filtered.length} / ${DATA.length} 条`;

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map((d, i) => {
    const dots = d.images.length > 1
      ? `<div class="img-dots">${d.images.map((_, j) => `<span class="dot${j===0?' active':''}"></span>`).join('')}</div>`
      : '';
    const count = d.images.length > 1
      ? `<span class="img-count">${d.images.length} 张</span>`
      : '';

    return `<div class="card" data-idx="${i}" onclick="openLightbox(${i})">
      <div class="card-images">
        <div class="img-scroll" onscroll="updateDots(this)">
          ${d.images.map(url => `<div class="img-item"><img src="${url}" alt="${d.title}" loading="lazy" onclick="event.stopPropagation();openLightbox(${i},0)"></div>`).join('')}
        </div>
        ${count}${dots}
      </div>
      <div class="card-body">
        <div class="card-title">${d.title}</div>
        <div class="card-tags">
          <span class="tag game">${d.game}</span>
          ${d.stage ? `<span class="tag stage">${d.stage}</span>` : ''}
          ${d.category.map(c => `<span class="tag cat">${c}</span>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('');
}

function updateDots(scrollEl) {
  const dots = scrollEl.parentElement.querySelectorAll('.dot');
  if (!dots.length) return;
  const scrollLeft = scrollEl.scrollLeft;
  const width = scrollEl.offsetWidth;
  const idx = Math.round(scrollLeft / width);
  dots.forEach((d, i) => d.classList.toggle('active', i === idx));
}

// Lightbox
function openLightbox(cardIdx, imgIdx = 0) {
  const filtered = getFiltered();
  const record = filtered[cardIdx];
  if (!record) return;
  currentLbImages = record.images;
  currentLbIndex = imgIdx;
  currentLbRecord = record;
  updateLightbox();
  document.getElementById('lightbox').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
  document.body.style.overflow = '';
}

function navLightbox(dir) {
  currentLbIndex = (currentLbIndex + dir + currentLbImages.length) % currentLbImages.length;
  updateLightbox();
}

function updateLightbox() {
  document.getElementById('lbImg').src = currentLbImages[currentLbIndex];
  document.getElementById('lbTitle').textContent = currentLbRecord.title;
  document.getElementById('lbMeta').textContent = `${currentLbRecord.game} · ${currentLbRecord.stage || ''} · ${currentLbIndex + 1}/${currentLbImages.length}`;
  // Show/hide nav buttons
  document.querySelector('.lightbox-nav.prev').style.display = currentLbImages.length > 1 ? '' : 'none';
  document.querySelector('.lightbox-nav.next').style.display = currentLbImages.length > 1 ? '' : 'none';
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  const lb = document.getElementById('lightbox');
  if (!lb.classList.contains('show')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);
});

// Click outside to close lightbox
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === document.getElementById('lightbox') || e.target.classList.contains('lightbox-content')) {
    closeLightbox();
  }
});

// Back to top
const backBtn = document.createElement('button');
backBtn.className = 'back-to-top';
backBtn.innerHTML = '↑';
backBtn.title = '回到顶部';
backBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
document.body.appendChild(backBtn);

window.addEventListener('scroll', () => {
  backBtn.classList.toggle('show', window.scrollY > 400);
});

init();
</script>
</body>
</html>
